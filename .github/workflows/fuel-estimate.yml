name: Fuel estimate (private)

# Works out the expected change in next month's fuel prices from the Central
# Energy Fund's daily sheets, and keeps the result as a private workflow
# artifact. It commits nothing and publishes nothing: CEF has not agreed to its
# figures being shown (docs/fuel.md, decision D3).
#
# Manual only. Do not add a schedule until CEF agrees. GitHub keeps artifacts
# for 7 days here. The backtest that sets the range needs the past sheets, so
# this run fetches every sheet listed (5 seconds apart, honest User-Agent).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuel-estimate
  cancel-in-progress: false

jobs:
  estimate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install the PDF reader
        run: python -m pip install --quiet pypdf

      - name: Fetch the CEF daily sheets
        run: python scripts/fuel/fetch_cef.py

      - name: Backtest and estimate
        run: |
          python scripts/fuel/backtest.py sources/releases/fuel/cef src/data/fuel/prices.json sources/releases/fuel/backtest
          python scripts/fuel/estimate.py sources/releases/fuel/estimate.json

      - uses: actions/upload-artifact@v4
        with:
          name: fuel-estimate
          path: |
            sources/releases/fuel/estimate.json
            sources/releases/fuel/backtest/backtest.md
          retention-days: 7
