name: Release

# Run by hand from the Actions tab. Tags the current main and publishes a
# GitHub release whose notes are generated from the pull requests merged since
# the previous release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v, for example 1.4.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.4.0"
            exit 1
          fi
          gh release create "v$VERSION" --target "$TARGET" --title "v$VERSION" --generate-notes
