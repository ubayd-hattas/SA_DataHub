name: Report an error
description: A figure, date or source on SA Data Hub looks wrong.
title: "Error: "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page, e.g. https://sadatahub.tech/series/cpi-headline
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What looks wrong?
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: Where did you see the correct figure?
      description: The release and page, if you know it.
